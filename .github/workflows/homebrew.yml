name: Homebrew

# Releases are drafted and published by hand, and a draft's archives can't be
# downloaded, so the formula follows publication rather than the tag. `released`
# also covers a prerelease promoted later, and never fires for a prerelease.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published tag to point the formula at (e.g. v2.8.0)"
        required: true

permissions:
  contents: read

concurrency: homebrew-tap

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brzzdev/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Render the formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the latest release may own the formula, so a dispatch for an
          # old tag or a prerelease, or a late publish of an older line, can't
          # downgrade it.
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$TAG" != "$latest" ]; then
            echo "error: $TAG is not the latest release ($latest)" >&2
            exit 1
          fi
          gh release download "$TAG" --pattern SHA256SUMS
          mkdir -p tap/Formula
          .github/homebrew/formula.sh "${TAG#v}" SHA256SUMS > tap/Formula/perch.rb

      - name: Push to the tap
        working-directory: tap
        run: |
          git add Formula/perch.rb
          if git diff --cached --quiet; then
            echo "Formula already points at $TAG"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "perch ${TAG#v}"
          git push --quiet
