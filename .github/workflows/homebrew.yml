name: Homebrew

# Releases are drafted and published by hand, and a draft's archives can't be
# downloaded, so the formula follows publication rather than the tag. `released`
# also covers a prerelease promoted later, and never fires for a prerelease.
#
# Every run points the formula at the latest release, whatever started it, so a
# queued run that concurrency replaces loses nothing, and a dispatch re-syncs.
on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

concurrency: homebrew-tap

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brzzdev/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Render the formula
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release view --json tagName --jq .tagName)"
          gh release download "$tag" --pattern SHA256SUMS
          mkdir -p tap/Formula
          .github/homebrew/formula.sh "${tag#v}" SHA256SUMS > tap/Formula/perch.rb
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Push to the tap
        working-directory: tap
        run: |
          git add Formula/perch.rb
          if git diff --cached --quiet; then
            echo "Formula already points at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "perch $VERSION"
          git push --quiet
