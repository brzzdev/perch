name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v1.0.12)"
        required: true

permissions:
  actions: write
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      # The archive unpacks to a self-contained directory: the binary plus the
      # completions `just install-completions` would otherwise supply.
      - name: Stage the archive contents
        run: |
          stage="perch-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/perch" "$stage/"
          cp -R completions "$stage/"
          cp README.md LICENSE "$stage/"
          tar -czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perch-${{ matrix.target }}
          path: perch-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksum the archives
        working-directory: artifacts
        run: sha256sum -- *.tar.gz > SHA256SUMS

      # Created as a draft so the release notes can be written by hand before
      # anything goes public; --generate-notes only seeds a starting point.
      # A rebuild of an existing tag replaces its assets instead of failing,
      # and --verify-tag keeps a mistyped dispatch input from inventing a tag.
      # Rebuilt archives carry new checksums, and asset uploads fire no release
      # event, so a rebuild of a published release re-points the formula itself.
      - name: Draft the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false ]; then
              gh workflow run homebrew.yml -f tag="$TAG"
            fi
          else
            gh release create "$TAG" artifacts/* \
              --title "$TAG" \
              --draft \
              --generate-notes \
              --verify-tag
          fi
